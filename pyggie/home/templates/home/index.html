<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pyggie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0f0e;
      --surface:   #141714;
      --surface2:  #1a1d1a;
      --border:    rgba(255,255,255,0.07);
      --border2:   rgba(255,255,255,0.13);
      --text:      #e8ebe5;
      --muted:     #7a8577;
      --accent:    #a3c98a;
      --accent2:   #6fa84e;
      --user-bg:   #1e2b1a;
      --user-brd:  rgba(163,201,138,0.2);
      --ai-bg:     #151815;
      --radius:    12px;
      --font-body: 'DM Sans', sans-serif;
      --font-mono: 'DM Mono', monospace;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.6;
    }

    /* ─── layout ─── */
    .shell {
      display: grid;
      grid-template-columns: 240px 1fr;
      grid-template-rows: 100vh;
      height: 100vh;
    }

    /* ─── sidebar ─── */
    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 0;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 20px 18px 16px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-family: var(--font-mono);
      font-size: 17px;
      font-weight: 500;
      letter-spacing: -0.03em;
      color: var(--accent);
    }

    .logo span {
      color: var(--muted);
      font-weight: 300;
    }

    .new-chat-btn {
      margin: 14px 14px 0;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px;
      border-radius: 8px;
      border: 1px solid var(--border2);
      background: transparent;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      width: calc(100% - 28px);
    }

    .new-chat-btn:hover { background: var(--surface2); border-color: var(--accent); }

    .new-chat-btn svg { color: var(--accent); flex-shrink: 0; }

    .history-label {
      padding: 18px 18px 6px;
      font-size: 10px;
      font-family: var(--font-mono);
      letter-spacing: 0.12em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 8px;
      scrollbar-width: thin;
      scrollbar-color: var(--border2) transparent;
    }

    .history-item {
      padding: 8px 10px;
      border-radius: 7px;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background 0.1s, color 0.1s;
    }

    .history-item:hover { background: var(--surface2); color: var(--text); }
    .history-item.active { background: var(--user-bg); color: var(--accent); }

    .sidebar-footer {
      border-top: 1px solid var(--border);
      padding: 12px 14px;
    }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .user-pill:hover { background: var(--surface2); }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--user-bg);
      border: 1px solid var(--user-brd);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--accent);
      flex-shrink: 0;
    }

    .user-name { font-size: 13px; font-weight: 400; }
    .user-role { font-size: 11px; color: var(--muted); }

    /* ─── main ─── */
    .main {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .topbar {
      height: 52px;
      padding: 0 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .model-badge {
      display: flex;
      align-items: center;
      gap: 7px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--muted);
      padding: 5px 10px;
      border-radius: 20px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .model-badge:hover { border-color: var(--border2); color: var(--text); }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent2);
      box-shadow: 0 0 6px var(--accent2);
    }

    .topbar-actions { display: flex; gap: 8px; }

    .icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .icon-btn:hover { background: var(--surface2); color: var(--text); }

    /* ─── messages ─── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 32px 0;
      scrollbar-width: thin;
      scrollbar-color: var(--border2) transparent;
    }

    .message-row {
      max-width: 720px;
      margin: 0 auto 28px;
      padding: 0 32px;
      animation: fadeUp 0.25s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg-meta {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 8px;
      font-size: 12px;
      font-family: var(--font-mono);
      color: var(--muted);
    }

    .msg-avatar {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 500;
      flex-shrink: 0;
    }

    .msg-avatar.ai  { background: var(--surface2); border: 1px solid var(--border2); color: var(--accent); }
    .msg-avatar.usr { background: var(--user-bg);  border: 1px solid var(--user-brd); color: var(--accent); }

    .msg-bubble {
      padding: 14px 18px;
      border-radius: var(--radius);
      font-size: 14.5px;
      line-height: 1.65;
    }

    .msg-bubble.ai  { background: var(--ai-bg);   border: 1px solid var(--border); }
    .msg-bubble.usr { background: var(--user-bg); border: 1px solid var(--user-brd); }

    .msg-bubble code {
      font-family: var(--font-mono);
      font-size: 13px;
      background: rgba(163,201,138,0.08);
      border: 1px solid rgba(163,201,138,0.15);
      padding: 1px 6px;
      border-radius: 4px;
      color: var(--accent);
    }

    /* ─── empty state ─── */
    .empty-state {
      max-width: 520px;
      margin: auto;
      padding: 0 32px;
      text-align: center;
      animation: fadeUp 0.3s ease both;
    }

    .empty-glyph {
      font-family: var(--font-mono);
      font-size: 32px;
      color: var(--accent);
      opacity: 0.6;
      margin-bottom: 20px;
      letter-spacing: -0.05em;
    }

    .empty-title {
      font-size: 22px;
      font-weight: 300;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-bottom: 8px;
    }

    .empty-sub {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 28px;
      line-height: 1.7;
    }

    .suggestions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .suggestion {
      padding: 12px 14px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 12.5px;
      color: var(--muted);
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      font-family: var(--font-body);
      line-height: 1.5;
    }

    .suggestion:hover { border-color: var(--accent); color: var(--text); background: var(--user-bg); }
    .suggestion strong { display: block; color: var(--text); font-weight: 500; font-size: 13px; margin-bottom: 2px; }

    /* ─── input ─── */
    .input-area {
      padding: 16px 24px 20px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .input-box {
      max-width: 720px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 13px;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 10px 12px 10px 16px;
      transition: border-color 0.2s;
    }

    .input-box:focus-within { border-color: rgba(163,201,138,0.4); }

    .input-box textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 14.5px;
      line-height: 1.55;
      max-height: 180px;
      min-height: 24px;
      scrollbar-width: none;
    }

    .input-box textarea::placeholder { color: var(--muted); }

    .send-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: none;
      background: var(--accent2);
      color: #0d0f0e;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
    }

    .send-btn:hover { background: var(--accent); }
    .send-btn:active { transform: scale(0.94); }
    .send-btn:disabled { background: var(--surface2); color: var(--muted); cursor: default; }

    .input-hint {
      max-width: 720px;
      margin: 7px auto 0;
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--muted);
      text-align: center;
      opacity: 0.7;
    }

    /* ─── scrollbar ─── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }
  </style>
</head>
<body>

<div class="shell">

  <!-- sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo">pyggie<span>.ai</span></div>
    </div>

    <button class="new-chat-btn" onclick="newChat()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      New conversation
    </button>

    <div class="history-label">Recent</div>
    <div class="history-list" id="historyList">
      <div class="history-item active">Current session</div>
      <div class="history-item">Debug Django urls.py</div>
      <div class="history-item">Explain AC circuit resonance</div>
      <div class="history-item">Planetary magnetic fields</div>
    </div>

    <div class="sidebar-footer">
      <div class="user-pill">
        <div class="avatar">W</div>
        <div>
          <div class="user-name">wh1t3_01l</div>
          <div class="user-role">free plan</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- main -->
  <div class="main">
    <div class="topbar">
      <div class="model-badge">
        <div class="dot"></div>
        pyggie-1 · default
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" title="Share">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
          </svg>
        </button>
        <button class="icon-btn" title="Settings">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- messages -->
    <div class="messages" id="messages">
      <div class="empty-state" id="emptyState">
        <div class="empty-glyph">&gt;_</div>
        <div class="empty-title">What can I help with?</div>
        <div class="empty-sub">Ask anything. I'll be direct.</div>
        <div class="suggestions">
          <button class="suggestion" onclick="useSuggestion('Explain how transformers work in ML')">
            <strong>Explain a concept</strong>How do transformers work?
          </button>
          <button class="suggestion" onclick="useSuggestion('Debug this Python code: ')">
            <strong>Debug code</strong>Paste an error or snippet
          </button>
          <button class="suggestion" onclick="useSuggestion('Summarise the key ideas in ')">
            <strong>Summarise</strong>A paper, article, or topic
          </button>
          <button class="suggestion" onclick="useSuggestion('Compare ')">
            <strong>Compare options</strong>Two approaches or tools
          </button>
        </div>
      </div>
    </div>

    <!-- input -->
    <div class="input-area">
      <div class="input-box">
        <textarea
          id="msgInput"
          placeholder="Message pyggie…"
          rows="1"
          onkeydown="handleKey(event)"
          oninput="autoResize(this)"
        ></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>
          </svg>
        </button>
      </div>
      <div class="input-hint">Enter to send &nbsp;·&nbsp; Shift+Enter for new line</div>
    </div>
  </div>
</div>

<script>
  const input   = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');
  const msgs    = document.getElementById('messages');
  const empty   = document.getElementById('emptyState');

  input.addEventListener('input', () => {
    sendBtn.disabled = input.value.trim() === '';
  });

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 180) + 'px';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!sendBtn.disabled) sendMessage();
    }
  }

  function addMessage(text, role) {
    if (empty) empty.style.display = 'none';
    const row = document.createElement('div');
    row.className = 'message-row';
    const label = role === 'user' ? 'you' : 'ai';
    const initials = role === 'user' ? 'W' : 'P';
    row.innerHTML = `
      <div class="msg-meta">
        <div class="msg-avatar ${role === 'user' ? 'usr' : 'ai'}">${initials}</div>
        ${label}
      </div>
      <div class="msg-bubble ${role === 'user' ? 'usr' : 'ai'}">${escHtml(text)}</div>
    `;
    msgs.appendChild(row);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, 'user');
      input.value = '';
      sendBtn.disabled = true;
  
      // create an empty AI bubble to stream into
      const bubble = addEmptyAiBubble();

      const resp = await fetch('/send/', {
          method: 'POST',
          headers: {
              'Content-Type': 'application/json',
              'X-CSRFToken': getCookie('csrftoken'),
          },
          body: JSON.stringify({
              content: text,
              model: document.getElementById('modelSelect').value,
              chat_id: currentChatId
          })
      });

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();

      while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const lines = decoder.decode(value).split('\n');
          for (const line of lines) {
              if (!line.startsWith('data: ')) continue;
              const payload = line.slice(6);
              if (payload === '[DONE]') { sendBtn.disabled = false; break; }
  
              const data = JSON.parse(payload);
              if (data.chat_id) currentChatId = data.chat_id;
              if (data.token)   bubble.textContent += data.token;
  
              msgs.scrollTop = msgs.scrollHeight;
          }
      }
  }

  function addEmptyAiBubble() {
      const row = document.createElement('div');
      row.className = 'message-row';
      row.innerHTML = `
          <div class="msg-meta">
              <div class="msg-avatar ai">P</div>
              ai
          </div>
          <div class="msg-bubble ai"></div>
      `;
      msgs.appendChild(row);
      msgs.scrollTop = msgs.scrollHeight;
      return row.querySelector('.msg-bubble');
  }
  
  function getCookie(name) {
      return document.cookie.split(';')
          .map(c => c.trim())
          .find(c => c.startsWith(name + '='))
          ?.split('=')[1];
  }

  function useSuggestion(text) {
    input.value = text;
    input.focus();
    sendBtn.disabled = false;
    autoResize(input);
    input.setSelectionRange(text.length, text.length);
  }

  function newChat() {
    msgs.innerHTML = '';
    msgs.appendChild(empty);
    empty.style.display = '';
    input.value = '';
    sendBtn.disabled = true;
  }
</script>

</body>
</html>
